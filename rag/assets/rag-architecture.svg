<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" role="img"
     aria-labelledby="t d">
  <title id="t">Local RAG of awesome-embodied-ai: index, query and citation guardrails</title>
  <desc id="d">Offline indexing chunks the corpus and embeds it with all-MiniLM-L6-v2 into a
  persistent ChromaDB collection. At query time the local web UI calls a loopback read-only
  server, the same model embeds the query, nearest neighbours are filtered by metadata, and
  --marco and --verify turn the hits into verifiable citations.</desc>

  <style>
    /* Palette copied verbatim from rag/web/index.html :root so the diagram matches the UI. */
    .bg{fill:#0f1115} .panel{fill:#171a21} .panel2{fill:#1e222b}
    .bx{fill:#171a21;stroke:#2a2f3a;stroke-width:1.2}
    .txt{fill:#e6e8ee} .dim{fill:#98a2b3} .acc{fill:#5eead4} .acc2{fill:#7dd3fc}
    .warn{fill:#fbbf24} .ok{fill:#86efac}
    .h{font-size:13px;font-weight:650}
    .b{font-size:11px;font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#c8cfdb}
    .s{font-size:10.5px;fill:#98a2b3}
    .lbl{font-size:11.5px;font-weight:650;fill:#e6e8ee;letter-spacing:.6px}
    .wire{stroke:#2a2f3a;stroke-width:1.4;fill:none}
    .wire2{stroke:#3b4351;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    .pk{fill:#5eead4} .pkq{fill:#7dd3fc}
    .dot{fill:#39414f}
    text{dominant-baseline:middle}

    @keyframes ants{to{stroke-dashoffset:-240}}
    @keyframes pkI{0%,2%{opacity:0}4%,10%{opacity:1}12%,100%{opacity:0}}
    @keyframes mvR{0%{transform:translateX(0)}100%{transform:translateX(38px)}}
    @keyframes pkFall{0%,20%{opacity:0}22%,31%{opacity:1}33%,100%{opacity:0}}
    @keyframes mvD{0%{transform:translateY(0)}100%{transform:translateY(118px)}}
    @keyframes newVec{0%,28%{fill:#39414f}32%,44%{fill:#5eead4}50%,100%{fill:#39414f}}
    @keyframes pkQ{0%,38%{opacity:0}40%,52%{opacity:1}54%,100%{opacity:0}}
    @keyframes pkRise{0%,54%{opacity:0;transform:translate(0,0)}56%{opacity:1}
      62%{opacity:1;transform:translate(0,-50px)}70%{opacity:1;transform:translate(135px,-125px)}
      74%,100%{opacity:0;transform:translate(135px,-125px)}}
    @keyframes nearDot{0%,66%{fill:#39414f}70%,88%{fill:#5eead4}94%,100%{fill:#39414f}}
    @keyframes ring{0%,66%{opacity:0;transform:scale(.35)}71%{opacity:.85;transform:scale(1)}
      86%,100%{opacity:0;transform:scale(2)}}
    @keyframes pkOut{0%,76%{opacity:0}78%,86%{opacity:1}88%,100%{opacity:0}}
    @keyframes mvD2{0%{transform:translateY(0)}100%{transform:translateY(64px)}}
    @keyframes glowA{0%,84%{stroke:#2a2f3a}88%,96%{stroke:#86efac}100%{stroke:#2a2f3a}}
    @keyframes glowB{0%,22%{stroke:#2a2f3a}26%,34%{stroke:#5eead4}40%,100%{stroke:#2a2f3a}}
    @keyframes glowC{0%,54%{stroke:#2a2f3a}58%,70%{stroke:#7dd3fc}76%,100%{stroke:#2a2f3a}}

    .ants{animation:ants 14s linear infinite}
    .g1{animation:pkI 9s linear infinite,mvR 9s linear infinite}
    .g2{animation:pkI 9s linear infinite 6s,mvR 9s linear infinite 6s}
    .g3{animation:pkI 9s linear infinite 12s,mvR 9s linear infinite 12s}
    .f1{animation:pkFall 9s linear infinite,mvD 9s linear infinite}
    .f2{animation:pkFall 9s linear infinite 4s,mvD 9s linear infinite 4s}
    .nv{animation:newVec 9s linear infinite}
    .q1{animation:pkQ 9s linear infinite,mvR 9s linear infinite}
    .q2{animation:pkQ 9s linear infinite 8s,mvR 9s linear infinite 8s}
    .rise{animation:pkRise 9s linear infinite}
    .nd{animation:nearDot 9s linear infinite}
    .rg{animation:ring 9s linear infinite;transform-box:fill-box;transform-origin:center}
    .out{animation:pkOut 9s linear infinite,mvD2 9s linear infinite}
    .ga{animation:glowA 9s linear infinite}
    .gb{animation:glowB 9s linear infinite}
    .gc{animation:glowC 9s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b5568"/></marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5eead4"/></marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
    <marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
  </defs>

  <rect class="bg" width="1200" height="900"/>

  <!-- machine boundary: everything above the line stays on this computer -->
  <rect class="ants" x="16" y="16" width="1168" height="804" rx="18" fill="none"
        stroke="#2a2f3a" stroke-width="1.4" stroke-dasharray="9 7"/>
  <text class="s" x="44" y="34">127.0.0.1 · no credentials · no CDN · no cloud</text>

  <text class="txt" x="44" y="58" font-size="17" font-weight="650">Local RAG <tspan class="acc">·</tspan> awesome-embodied-ai</text>
  <text class="s" x="44" y="80">Index offline, query in the browser, cite with evidence. The interface chrome is Spanish; the queries go in English.</text>

  <text class="lbl" x="40" y="106">1 · BUILD THE INDEX — offline, run once <tspan class="dim" font-weight="400">(rag\build_index.py)</tspan></text>
  <text class="s" x="1160" y="106" text-anchor="end">--include-retired adds papers/_retirados/</text>

  <!-- corpus -->
  <rect class="bx" x="40" y="118" width="250" height="126" rx="10"/>
  <text class="h acc" x="56" y="140">Corpus — what gets indexed</text>
  <text class="b" x="56" y="163">papers/*.pdf      62 PDFs</text>
  <text class="b" x="56" y="180">papers.csv        20 columns</text>
  <text class="b" x="56" y="197">README · GLOSSARY · CONTRIBUTING</text>
  <text class="b" x="56" y="214">research-protocol · research-gaps</text>
  <text class="b" x="56" y="231">tactile-sota · PAPERS.md</text>

  <!-- chunking -->
  <rect class="bx" x="330" y="118" width="250" height="126" rx="10"/>
  <text class="h acc2" x="346" y="140">Chunking · raglib.py</text>
  <text class="b" x="346" y="163">1400 chars ≈ 300-350 tokens</text>
  <text class="b" x="346" y="180">overlap 220 · min 120</text>
  <text class="b" x="346" y="197">cut at paragraph boundaries</text>
  <text class="b" x="346" y="214">heading_path (md) · pages (pdf)</text>
  <text class="b" x="346" y="231">covers &amp; number-only → dropped</text>

  <!-- embedder -->
  <rect class="bx gc" x="620" y="118" width="250" height="126" rx="10"/>
  <text class="h txt" x="636" y="140">Embedder</text>
  <rect x="782" y="131" width="72" height="17" rx="8" fill="#1e222b" stroke="#7dd3fc" stroke-width="1"/>
  <text class="acc2" x="818" y="140" font-size="9.5" text-anchor="middle">shared</text>
  <text class="b" x="636" y="166">all-MiniLM-L6-v2  (ONNX)</text>
  <text class="b" x="636" y="183">384 dims · batch 64</text>
  <text class="b" x="636" y="200">cached in rag/models/</text>
  <text class="b" x="636" y="217">downloaded once → offline</text>
  <text class="s" x="636" y="234">same model for chunks and queries</text>

  <!-- chroma -->
  <rect class="bx gb" x="910" y="118" width="250" height="126" rx="10"/>
  <text class="h txt" x="926" y="140">ChromaDB · vector store</text>
  <text class="b" x="926" y="163">rag/chroma_db/  persistent</text>
  <text class="b" x="926" y="180">collection: embodied_ai</text>
  <text class="b" x="926" y="197">id = sha1(path)::index</text>
  <text class="b" x="926" y="214">vector · metadata · text</text>
  <text class="b" x="926" y="231">upsert: no dups · prunes gone</text>

  <!-- indexing wires + travelling packets -->
  <path class="wire" d="M290 181H330" marker-end="url(#ar)"/>
  <path class="wire" d="M580 181H620" marker-end="url(#ar)"/>
  <path class="wire" d="M870 181H910" marker-end="url(#ar)"/>
  <rect class="pk g1" x="293" y="176" width="9" height="9" rx="2" opacity="0"/>
  <rect class="pk g2" x="583" y="176" width="9" height="9" rx="2" opacity="0"/>
  <rect class="pk g3" x="873" y="176" width="9" height="9" rx="2" opacity="0"/>

  <!-- ChromaDB writes into the space -->
  <path class="wire" d="M1035 244V296" marker-end="url(#ar)"/>
  <text class="s" x="1047" y="272">upsert</text>
  <rect class="pk f1" x="1031" y="248" width="8" height="8" rx="2" opacity="0"/>
  <rect class="pk f2" x="1031" y="248" width="8" height="8" rx="2" opacity="0"/>

  <!-- ===================== embedding space ===================== -->
  <rect class="bx" x="40" y="300" width="1120" height="180" rx="10"/>
  <text class="h txt" x="56" y="322">The embedding space</text>
  <text class="s" x="200" y="322">384 dimensions · cosine similarity · closer = more similar</text>

  <!-- background chunks -->
  <g class="dot">
    <circle cx="120" cy="360" r="3.4"/><circle cx="158" cy="412" r="3.4"/>
    <circle cx="196" cy="378" r="3.4"/><circle cx="232" cy="432" r="3.4"/>
    <circle cx="392" cy="362" r="3.4"/><circle cx="418" cy="424" r="3.4"/>
    <circle cx="576" cy="360" r="3.4"/><circle cx="598" cy="436" r="3.4"/>
    <circle cx="752" cy="448" r="3.4"/><circle cx="776" cy="356" r="3.4"/>
    <circle cx="952" cy="364" r="3.4"/><circle cx="986" cy="428" r="3.4"/>
    <circle cx="1102" cy="398" r="3.4"/><circle cx="96" cy="440" r="3.4"/>
    <circle cx="1128" cy="362" r="3.4"/>
  </g>
  <!-- semantic clusters -->
  <g class="dot">
    <circle cx="272" cy="378" r="3.4"/><circle cx="288" cy="402" r="3.4"/>
    <circle cx="306" cy="384" r="3.4"/><circle cx="320" cy="410" r="3.4"/>
    <circle cx="296" cy="420" r="3.4"/><circle cx="332" cy="394" r="3.4"/>
    <circle cx="262" cy="404" r="3.4"/><circle cx="314" cy="364" r="3.4"/>
    <circle cx="478" cy="404" r="3.4"/><circle cx="496" cy="424" r="3.4"/>
    <circle cx="516" cy="408" r="3.4"/><circle cx="466" cy="428" r="3.4"/>
    <circle cx="530" cy="430" r="3.4"/><circle cx="490" cy="440" r="3.4"/>
    <circle cx="512" cy="392" r="3.4"/>
    <circle cx="662" cy="362" r="3.4"/><circle cx="680" cy="382" r="3.4"/>
    <circle cx="700" cy="366" r="3.4"/><circle cx="650" cy="386" r="3.4"/>
    <circle cx="714" cy="392" r="3.4"/><circle cx="672" cy="356" r="3.4"/>
    <circle cx="696" cy="404" r="3.4"/>
    <circle cx="866" cy="428" r="3.4"/><circle cx="904" cy="424" r="3.4"/>
    <circle cx="848" cy="416" r="3.4"/><circle cx="890" cy="436" r="3.4"/>
  </g>
  <g class="s" font-size="10" text-anchor="middle">
    <text x="298" y="446">VLA</text><text x="500" y="464">sim2real</text>
    <text x="686" y="428">tactile</text><text x="878" y="458">ROS 2</text>
  </g>
  <!-- vectors landing during indexing -->
  <g>
    <circle class="nv" cx="1014" cy="414" r="4"/><circle class="nv" cx="1042" cy="386" r="4"/>
    <circle class="nv" cx="1070" cy="430" r="4"/><circle class="nv" cx="1034" cy="452" r="4"/>
  </g>

  <!-- the query vector probes the space -->
  <path class="wire2" d="M745 536V480L878 407" marker-end="url(#arS)"/>
  <text class="acc2" x="757" y="512" font-size="10.5">query vector</text>
  <circle class="pkq rise" cx="745" cy="530" r="5" opacity="0"/>
  <!-- nearest neighbours win -->
  <g fill="none" stroke="#5eead4" stroke-width="1.4">
    <circle class="rg" cx="874" cy="414" r="9" opacity="0"/>
    <circle class="rg" cx="894" cy="398" r="9" opacity="0" style="animation-delay:.12s"/>
    <circle class="rg" cx="858" cy="396" r="9" opacity="0" style="animation-delay:.24s"/>
  </g>
  <circle class="nd" cx="874" cy="414" r="4.6"/><circle class="nd" cx="894" cy="398" r="4.6"/>
  <circle class="nd" cx="858" cy="396" r="4.6"/>
  <text class="acc" x="912" y="386" font-size="10.5">top-k</text>

  <!-- top-k back to the results box -->
  <path class="wire" d="M1035 480V532" marker-end="url(#ar)"/>
  <text class="s" x="1047" y="508">hits + metadata</text>
  <rect class="pk out" x="1031" y="472" width="8" height="8" rx="2" opacity="0"/>

  <text class="lbl" x="40" y="526">2 · QUERY — read-only, loopback <tspan class="dim" font-weight="400">(rag\serve.py → http://127.0.0.1:8757/)</tspan></text>

  <!-- web ui -->
  <rect class="bx" x="40" y="536" width="250" height="126" rx="10"/>
  <text class="h acc" x="56" y="558">Web UI · web/index.html</text>
  <text class="b" x="56" y="581">Buscar (Search) · Contexto LLM</text>
  <text class="b" x="56" y="598">k · category · folder · source</text>
  <text class="b" x="56" y="615">year_min/max · min_sim · contains</text>
  <text class="s" x="56" y="634">the chrome is Spanish, so</text>
  <text class="warn" x="56" y="650" font-size="11" font-weight="650">TYPE THE QUERY IN ENGLISH</text>

  <!-- serve.py -->
  <rect class="bx" x="330" y="536" width="250" height="126" rx="10"/>
  <text class="h acc2" x="346" y="558">serve.py · http.server</text>
  <text class="b" x="346" y="581">GET /api/search · /api/prompt</text>
  <text class="b" x="346" y="598">/api/marco · /api/verify</text>
  <text class="b" x="346" y="615">/api/facets · /api/stats</text>
  <text class="b" x="346" y="632">/healthz</text>
  <text class="s" x="346" y="650">read-only · no auth · validates k, min_sim</text>

  <!-- retrieval -->
  <rect class="bx" x="620" y="536" width="250" height="126" rx="10"/>
  <text class="h txt" x="636" y="558">Retrieval · build_where()</text>
  <text class="b" x="636" y="581">embeds the query with the</text>
  <text class="b" x="636" y="598">same 384-d model</text>
  <text class="b" x="636" y="615">ANN over the collection</text>
  <text class="b" x="636" y="632">+ metadata where-filters</text>
  <text class="s" x="636" y="650">serve.py reuses it → web == HTTP == CLI</text>

  <!-- results -->
  <rect class="bx ga" x="910" y="536" width="250" height="126" rx="10"/>
  <text class="h ok" x="926" y="558">Results</text>
  <text class="b" x="926" y="581">top-k fragments + score</text>
  <text class="b" x="926" y="598">metadata ready to cite</text>
  <text class="b" x="926" y="615">Contexto LLM → prompt block</text>
  <text class="b" x="926" y="632">/api/marco → framework</text>
  <text class="b" x="926" y="649">/api/verify → is it real?</text>

  <path class="wire" d="M290 599H330" marker-end="url(#ar)"/>
  <path class="wire" d="M580 599H620" marker-end="url(#ar)"/>
  <rect class="pkq q1" x="293" y="594" width="9" height="9" rx="2" opacity="0"/>
  <rect class="pkq q2" x="583" y="594" width="9" height="9" rx="2" opacity="0"/>

  <text class="lbl" x="40" y="706">3 · GUARDRAILS — from search engine to citation pipeline</text>

  <!-- marco -->
  <rect class="bx" x="40" y="716" width="540" height="84" rx="10"/>
  <text class="h warn" x="56" y="736">query.py --marco · evidence by sections</text>
  <text class="b" x="56" y="758">State of the art · Limitations · Gaps · Theoretical bases</text>
  <text class="b" x="56" y="775">Quantitative comparison · ROS 2 integration · BibTeX</text>
  <text class="s" x="56" y="791">warns: coverage &lt;3 papers · bias to 2025-26 · "Surname et al."</text>

  <!-- verify -->
  <rect class="bx" x="620" y="716" width="470" height="84" rx="10"/>
  <text class="h warn" x="636" y="736">query.py --verify · anti-hallucination</text>
  <text class="b" x="636" y="758">closed corpus (62 papers) → confirmed · probable · not_found</text>
  <text class="b" x="636" y="775">reads ONLY papers.csv — no Chroma → ms, not 15-25 s</text>
  <text class="s" x="636" y="791">exit 0 if confirmed · always returns nearby candidates</text>

  <!-- the only exit: what you copy -->
  <path d="M1130 662V834" fill="none" stroke="#fbbf24" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#arW)"/>
  <text class="warn" x="1122" y="692" font-size="10.5" text-anchor="end">Copiar</text>

  <!-- legend + footer -->
  <g>
    <rect class="pk" x="44" y="843" width="9" height="9" rx="2"/>
    <text class="s" x="59" y="848">indexing (offline)</text>
    <rect class="pkq" x="176" y="843" width="9" height="9" rx="2"/>
    <text class="s" x="191" y="848">query (loopback)</text>
    <circle cx="304" cy="848" r="4.6" fill="#5eead4"/>
    <text class="s" x="314" y="848">nearest neighbours</text>
    <path d="M436 848h26" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text class="s" x="468" y="848">leaves the machine</text>
  </g>
  <text class="s" x="44" y="872">cache\ reuses the text extracted from each PDF   ·   offline once rag\models\ is cached   ·   build_index.py · serve.py · query.py</text>

  <!-- outside -->
  <rect x="880" y="838" width="280" height="44" rx="10" fill="#1e222b"
        stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="warn" x="1020" y="854" font-size="12" font-weight="650" text-anchor="middle">your LLM · external</text>
  <text class="s" x="1020" y="870" text-anchor="middle">receives only the text you copy</text>
</svg>




